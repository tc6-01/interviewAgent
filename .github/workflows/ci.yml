name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Validate builtin question bank schema and noise rules
        run: make questionbank-validate

      - name: API and embedded web smoke
        run: make smoke

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend
        id: detect
        run: |
          if [ -f interview-agent-web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No interview-agent-web/package.json found; skipping frontend build."
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & verify
        if: steps.detect.outputs.present == 'true'
        working-directory: interview-agent-web
        run: |
          npm ci
          npm run typecheck
          npm run test:run
          VITE_API_MODE=real npm run build
          git diff --exit-code -- ../internal/webui/dist

      - name: Audit frontend dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: interview-agent-web
        run: npm audit --audit-level=high

  security:
    name: Security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Repository secret and unsafe-pattern scan
        run: make security-scan

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Audit Go dependencies
        run: govulncheck ./...

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t interview-agent:ci .

      - name: Validate docker-compose
        run: |
          cp .env.example .env
          docker compose config -q
